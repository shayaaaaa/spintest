# Optional: publish the site with GitHub Actions instead of "Deploy from a branch". Besides the repository files it
# adds the checksum-verified Alpine Linux image next to Ai Agent, so the app's Linux VM can download it from the same
# origin (the Alpine mirror itself blocks cross-origin downloads in browsers).
# To use it: repository Settings → Pages → Build and deployment → Source: GitHub Actions.
# While Pages publishes from a branch, this workflow only checks the setting and does nothing else.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.mode.outputs.build_type }}
    steps:
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "build_type=$t" >> "$GITHUB_OUTPUT"
          if [ "$t" != workflow ]; then echo "::notice::Pages publishes from a branch ($t), so there is nothing to deploy here. Set Settings → Pages → Source to GitHub Actions to also publish the Linux VM image."; fi

  deploy:
    needs: check
    if: needs.check.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the Alpine Linux image for the Ai Agent VM (checksum verified)
        run: |
          set -euo pipefail
          base=https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86
          curl -fsSL "$base/latest-releases.yaml" -o /tmp/rel.yaml
          file=$(awk '/flavor: alpine-virt$/{f=1} f && /^ *file:/{print $2; exit}' /tmp/rel.yaml)
          sha=$(awk '/flavor: alpine-virt$/{f=1} f && /^ *sha256:/{print $2; exit}' /tmp/rel.yaml)
          ver=$(echo "$file" | sed -E 's/alpine-virt-([0-9.]+)-x86\.iso/\1/')
          mkdir -p ai-agent/runtimes
          curl -fsSL "$base/$file" -o ai-agent/runtimes/alpine.iso
          echo "$sha  ai-agent/runtimes/alpine.iso" | sha256sum -c -
          printf '{"file":"%s","version":"%s","sha256":"%s"}\n' "$file" "$ver" "$sha" > ai-agent/runtimes/alpine.json
          cat ai-agent/runtimes/alpine.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
