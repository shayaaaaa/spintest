<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ironmarch Frontier — RTS Prototype</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="resource materials"><span class="dot"></span><span id="hudMaterials">0</span></div>
      <div class="resource lumber"><span class="dot"></span><span id="hudLumber">0</span></div>
      <div class="supply" id="hudSupply">0 / 0</div>
      <div class="hero-badge" id="heroBadge">
        <span id="heroLevel">Lv.1</span>
        <div class="hero-xp-bar"><div class="hero-xp-fill" id="heroXpFill"></div></div>
      </div>
      <button class="menu-btn" id="pauseBtn">⏸</button>
    </div>

    <div id="minimap"></div>

    <div id="selectionInfo"></div>
    <div id="actionBar"></div>

    <div id="tooltipCard"></div>

    <div class="overlay-screen" id="mainMenu">
      <h1>Ironmarch Frontier</h1>
      <p>An original real-time strategy prototype — resource gathering, base building, hero units, and skirmish AI. Built for touch.</p>
      <div class="race-grid" id="raceGrid"></div>
      <button class="btn" id="startBtn">Start Skirmish</button>
      <button class="btn secondary hidden" id="resumeBtn">Resume Saved Game</button>
    </div>

    <div class="overlay-screen hidden" id="pauseMenu">
      <h1>Paused</h1>
      <button class="btn" id="resumeFromPauseBtn">Resume</button>
      <button class="btn secondary" id="saveBtn">Save Game</button>
      <button class="btn danger" id="quitBtn">Quit to Menu</button>
    </div>

    <div class="overlay-screen hidden" id="gameOverScreen">
      <h1 id="gameOverTitle">Victory!</h1>
      <button class="btn" id="playAgainBtn">Back to Menu</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
